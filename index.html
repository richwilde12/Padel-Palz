 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Padel Palz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel Palz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#f3f6f2; --card:#ffffff; --ink:#14201a; --muted:#64716a; --line:#dde5df;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e2f1e8; --ball:#d9f24a;
  --win:#1f7a4d; --loss:#b4483b; --draw:#8a7a2b; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18211c; --ink:#e8efe9; --muted:#93a198; --line:#2a352f;
    --accent:#3fae77; --accent-ink:#06120b; --accent-soft:#1c3427; --win:#5fc791; --loss:#e07c6f; --draw:#d1bf62; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.help{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:16px;cursor:pointer;color:var(--accent)}
.guide h4{margin:0;font-size:15px}
.gsec{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.gsec>button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:0;padding:13px 14px;font-weight:700;text-align:left;cursor:pointer}
.gsec>button span{color:var(--muted);font-weight:600;transition:transform .15s}
.gsec.open>button span{transform:rotate(90deg)}
.gbody{padding:0 14px 12px;font-size:14px}
.gbody p{margin:6px 0}
.gbody ul,.gbody ol{margin:6px 0;padding-left:20px}
.gbody li{margin:5px 0}
.gbody .k{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.steps3{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps3 li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin:12px 0}
.steps3 li:before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800}
.steps3 b{display:block}
.steps3 small{color:var(--muted);font-size:13px}
h1{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.warn{color:var(--loss)}
button.status{background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.diag dt{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.diag dd{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;font-size:14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stack>*+*{margin-top:14px}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.round-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.round-h h2{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:17px;margin:0}
.round-h span{font-size:12px;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px}
.match:active{transform:scale(.99)}
.match .t{font-weight:600;overflow-wrap:anywhere}
.match .t.b{text-align:right}
.match .t.dim{color:var(--muted);font-weight:500}
.match .t small{display:block;font-weight:inherit}
.match .sc{min-width:74px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.match .sc .big{font-size:18px}
.match .sc .sets{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.match .sc .vs{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.court{grid-column:1/-1;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.bye{font-size:12px;color:var(--muted);margin:-2px 2px 8px}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td{padding:11px 4px;text-align:center;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.pos{width:26px;color:var(--muted);font-weight:600}
td.name{font-weight:600;overflow-wrap:anywhere}
td.pts{font-weight:800;font-size:16px}
tr.lead td.pos{color:var(--ink)}
tr.lead td.pos span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ball);color:#14201a}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:8px;border-radius:50%;display:inline-block}
.form .W{background:var(--win)}.form .L{background:var(--loss)}.form .D{background:var(--draw)}
@media (max-width:460px){.hide-sm{display:none}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.row .n{width:22px;color:var(--muted);font-size:13px;text-align:right;flex:none}
.icon{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg.big button{padding:12px 6px}
.seg.fmt button{padding:10px 4px;font-size:14px;line-height:1.2}
.seg.fmt button small{font-size:10.5px}
.seg.big button small{display:block;font-weight:500;font-size:11px;margin-top:2px;opacity:.85}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--loss);color:var(--loss)}
.btn.danger.armed{background:var(--loss);color:#fff}
.btn.armed:not(.danger){background:var(--ball);color:#14201a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:600px){.scrim{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:18px}
.vsline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 16px;font-weight:700}
.vsline div:last-child{text-align:right}
.vsline span{color:var(--muted);font-weight:500;font-size:12px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:8px}
.stepper input.val{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;width:96px;text-align:center;padding:8px 4px;background:var(--bg)}
.stepper .ctl{display:flex;gap:8px}
.stepper button{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;cursor:pointer}
.setgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center}
.setgrid .lab{font-size:12px;color:var(--muted);font-weight:600}
.setgrid input{text-align:center;font-size:18px;font-weight:700;padding:10px}
.setgrid .hd{font-size:12px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:grid;gap:8px;margin-top:18px}
.err{color:var(--loss);font-size:13px;margin-top:8px}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;color:var(--muted)}
.busy{opacity:.6;pointer-events:none}
.bbar{display:none}
.hbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer;color:var(--ink);display:grid;place-items:center;padding:0}
.hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.hbtn svg,.bbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.only-phone{display:none}
@media (max-width:767px){
  .tabs{display:none}
  .only-phone{display:grid}
  .hdr-r .mebtn{display:none}
  .wrap{padding-bottom:calc(98px + env(safe-area-inset-bottom))}
  .bbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:15;
    background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
  .bbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 0;min-height:48px;cursor:pointer;position:relative}
  .bbar button.on{color:var(--accent)}
  .bbar .score{color:var(--accent-ink)}
  .bbar .score .orb{width:56px;height:56px;margin-top:-26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(31,122,77,.35);border:3px solid var(--bg)}
  .bbar .score .orb svg{width:26px;height:26px;stroke:var(--accent-ink)}
  .bbar .score span{color:var(--accent)}
  .bbar .you{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:12px}
  .bbar button.on .you{background:var(--accent);color:var(--accent-ink)}
  .bbar .bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#d64545;color:#fff;font-size:10px;font-weight:800;line-height:16px}
}
@media (min-width:768px){ .wrap{max-width:860px} }
@media (min-width:1024px){
  .wrap{max-width:1180px}
  .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
  .split .side{position:sticky;top:70px}
  .megrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px;align-items:start}
}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--line) 0%,color-mix(in srgb,var(--line) 45%,var(--card)) 50%,var(--line) 100%);background-size:200% 100%;animation:skel 1.2s ease-in-out infinite;margin-bottom:10px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .skel{animation:none} .view.slide-left,.view.slide-right{animation:none} }
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:cfall var(--d,1.6s) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cfall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--x,0),105vh,0) rotate(var(--r,540deg));opacity:.9}}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:61;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.winbadge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--ball);color:#14201a;font-size:12px;font-weight:800}
.buildline{text-align:center;font-size:11px;color:var(--muted);margin-top:22px}
.view.slide-left{animation:slideL .2s ease-out}
.view.slide-right{animation:slideR .2s ease-out}
@keyframes slideL{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.mebtn{position:relative;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;cursor:pointer}
.mebtn.anon{background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:14px}
.mebtn .bdg{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#d64545;color:#fff;font-size:11px;font-weight:800;line-height:18px;border:2px solid var(--bg)}
.hdr-r .row1{display:flex;gap:8px}
.match.mine{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
tr.me td{background:var(--accent-soft)}
tr.me td.name:after{content:" \00b7 you";color:var(--accent);font-weight:600;font-size:12px}
.mehead{display:flex;align-items:center;gap:14px}
.mehead .av{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:28px;font-weight:800;flex:none}
.mehead h2{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:24px;margin:0;line-height:1.1}
.mehead .since{font-size:13px;color:var(--muted);margin-top:3px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;margin-bottom:8px;cursor:pointer;font-size:15px}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.sec-h{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:17px;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h small{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.next{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px}
.next .k{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.next .big{font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:20px;font-weight:800;margin:4px 0 2px}
.next .btn{background:var(--ball);color:#14201a;margin-top:10px;padding:11px}
.formrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.formrow i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff}
.formrow .W{background:var(--win)}.formrow .L{background:var(--loss)}.formrow .D{background:var(--draw)}
.plist .pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist .pr:last-child{border-bottom:0}
.plist .lab{font-size:12px;color:var(--muted);font-weight:600;width:96px;flex:none}
.plist .nm{flex:1;font-weight:700}
.plist .val{font-size:13px;color:var(--muted);text-align:right}
.news .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.news .it:last-child{border-bottom:0}
.news .ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;flex:none;font-size:15px}
.news .when{font-size:12px;color:var(--muted)}
.whogrid{max-height:52vh;overflow:auto;margin:10px -2px 0;padding:2px}
.youare{text-align:center;padding:10px 0 4px}
.youare .av{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",Inter,sans-serif;font-size:34px;font-weight:800}
.peep .pr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.peep .pr:last-child{border-bottom:0}
.peep .nm{font-weight:700}
.peep .meta{grid-column:1/2;font-size:12px;color:var(--muted)}
.peep .acts{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px;margin-top:8px}
.pchip{position:relative;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;padding:0 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s,transform .08s}
.pchip:active{transform:scale(.96)}
.pchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchip.on:before{content:"\2713  ";font-weight:800}
.pchip.pending{background:var(--ball);border-color:var(--ball);color:#14201a}
.pchip .tb{position:absolute;top:3px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-size:10px;font-weight:800;line-height:17px;color:#14201a}
.pchip.edit{border-style:dashed;color:var(--loss)}
.pchip.edit:after{content:"  \2715"}
.pchip.add{border-style:dashed;color:var(--accent);background:transparent}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phead .acts{display:flex;gap:6px}

  function scheduleAmericano(existing, addRounds){
    var ids=activeTeams().map(function(t){return t.id;}), n=ids.length, k=amCourts(n), sitN=n-4*k;
    var startR = existing.reduce(function(mx,m){return Math.max(mx,m.r);},0);
    var base = statsFrom(existing), bestPlan=null, bestTotal=Infinity;
    var attempts = n<=8 ? 12 : 6;
    for (var at=0; at<attempts; at++){
      var st=cloneStats(base), plan=[], total=0;
      for (var r=0;r<addRounds;r++){
        var order=shuffle(ids.slice()).sort(function(x,y){return (st.sits[x]||0)-(st.sits[y]||0) || (st.played[y]||0)-(st.played[x]||0);});
        var sitters=order.slice(0,sitN), sitSet={};
        sitters.forEach(function(p){sitSet[p]=1; st.sits[p]=(st.sits[p]||0)+1;});
        var playing=ids.filter(function(p){return !sitSet[p];});
        var res=bestRound(st,playing); total+=res.cost;

    bestPlan.forEach(function(games,ri){ games.forEach(function(p,gi){ out.push({id:uid("m"),r:startR+ri+1,i:gi,a:p[0],b:p[1],score:null}); }); });

  var PAIR_COLS = ["#d9f24a","#7fd3ff","#ffb36b","#c9a7ff","#7fe0b0","#ff9fb8","#ffe066","#a0b4ff","#b5e48c","#f4a3ff"];
  function lc(n){ return String(n||"").trim().toLowerCase(); }
  function splitPair(n){ var p=String(n||"").split(/\s*(?:&|\+|\/|\band\b)\s*/i).map(function(x){return x.trim();}).filter(Boolean); return p.length===2 ? p : [String(n||"").trim()]; }
  function knownPlayers(){
    var seen=Object.create(null), out=[], hidden=Object.create(null);
    (S.rosterHidden||[]).forEach(function(n){ hidden[lc(n)]=1; });
    function add(n){
      n=String(n||"").trim(); var k=lc(n); if(!n||hidden[k]) return;
      if (seen[k]!=null){ if (/^[a-z]/.test(out[seen[k]]) && /^[A-Z]/.test(n)) out[seen[k]]=n; return; } // prefer "Rich" over "rich"
      seen[k]=out.length; out.push(n);
    }
    (S.roster||[]).forEach(add);
    H.sessions.forEach(function(ss){ (ss.players||[]).forEach(function(n){ (ss.mode==="teams"?splitPair(n):[n]).forEach(add); }); });
    S.teams.forEach(function(t){ (IND()?[t.name]:splitPair(t.name)).forEach(add); });
    (S.picks||[]).forEach(add);
    return out.sort(function(a,b){ return a.localeCompare(b,"en",{sensitivity:"base"}); });
  }
  function picks(){ // fixed teams: players in the order they were tapped; partners pair up 1+2, 3+4 ...
    if (!Array.isArray(S.picks)){ S.picks=[]; S.teams.forEach(function(t){ var p=splitPair(t.name); if (p.length===2){ S.picks.push(p[0],p[1]); } }); }
    return S.picks;
  }
  function rebuildTeams(){
    var p=picks(), t=[];
    for (var i=0;i+1<p.length;i+=2) t.push({id:"t"+(i/2+1), name:p[i]+" & "+p[i+1]});
    S.teams=t;
  }
  function togglePlayer(name){
    var k=lc(name);
    if (IND()){
      var at=-1; S.teams.forEach(function(t,i){ if(lc(t.name)===k) at=i; });
      if (at>=0) S.teams.splice(at,1); else S.teams.push({id:uid("t"), name:name});
    } else {
      var p=picks(), idx=-1; p.forEach(function(n,i){ if(lc(n)===k) idx=i; });
      if (idx>=0){
        var mate = idx%2===0 ? idx+1 : idx-1, mateName = (mate<p.length) ? p[mate] : null;

  function applyPlayers(names){
    var keepM = S.matches.filter(function(m){ return m.score || (m.live && (m.live.h || m.live.ts)); });
    var dropped = S.matches.filter(function(m){ return keepM.indexOf(m)<0; });
    var rounds = {}; dropped.forEach(function(m){ rounds[m.r]=1; });
    S.teams.forEach(function(t){ var inn = names.some(function(n){ return lc(n)===lc(t.name); }); if (inn) delete t.out; else t.out = true; });
    names.forEach(function(n){ if (!S.teams.some(function(t){ return lc(t.name)===lc(n); })) S.teams.push({id:uid("t"), name:n}); });
    var add = Object.keys(rounds).length || (names.length ? 1 : 0);
    S.matches = keepM.concat(scheduleAmericano(keepM, add));
    ui.draft = null; ui.draftAdding = false;
    ui.notice = "Fixtures updated: "+add+" round"+(add===1?"":"s")+" rebuilt for "+activeTeams().length+" players.";
    if (needPin()){ askPin("players"); ui.afterPin = "commitAll"; } else commitAll();
  }
  function pairLeaves(id){

    ui.notice = t.name+" has left \u2013 their unplayed matches are removed.";

  function pairJoins(name){

    commitAll();

  /* ---------- Americano rules ---------- */
  function serveBlock(ppm){ return ({16:4,21:5,24:6,32:4})[ppm] || 4; }
  function servePlan(ppm){ // [{who:0..3, from, to}] ; who order: A1, B1, A2, B2
    var blk=serveBlock(ppm), out=[], p=1, i=0;
    while (p<=ppm){ var to=Math.min(ppm,p+blk-1); out.push({who:i%4,from:p,to:to}); p=to+1; i++; }
    return out;
  }
  function viewRules(){
    var ppm=S.ppm, blk=serveBlock(ppm), half=ppm?Math.floor(ppm/2):0;
    var labels=[["A","p1","Pair 1 – first server"],["C","p2","Pair 2 – first server"],["B","p1","Pair 1 – partner"],["D","p2","Pair 2 – partner"]];
    var h='<div class="stack rules">';
    h+='<div class="card"><h2>Scoring</h2><ul>'+
      '<li>Every rally is worth <b>1 point</b>, whoever served. There’s no 15-30-40, deuce or advantage.</li>'+
      (ppm? '<li>A match is <b>'+ppm+' points in total</b>, so it ends when '+ppm+' rallies have been played. It is <i>not</i> first to '+ppm+'. Scores always add up to '+ppm+' (e.g. '+Math.ceil(ppm*0.6)+'–'+(ppm-Math.ceil(ppm*0.6))+' or '+half+'–'+(ppm-half)+').</li>'
          : '<li>Matches are <b>timed</b>. When time is called, finish the rally being played, then stop. The score at that moment is the result.</li>')+
      '<li>Both players in a pair get the <b>pair’s score</b> as their own points. Win 15–9 and you each add 15; your opponents each add 9.</li>'+
      (ppm && ppm%2===0? '<li>A '+half+'–'+half+' draw is fine. Nobody plays an extra point.</li>':'')+
      '<li>The player with the most points at the end wins'+(S.rankBy==="avg"?' (this event ranks by <b>average points per match</b>, so sitting out doesn’t cost anyone)':'')+'. Ties are split by most wins, then the best points difference.</li>'+
      '</ul></div>';
    h+='<div class="card"><h2>Service rotation</h2>'+
      '<p>Serve passes between the pairs, and each player serves a block of <b>'+blk+' points in a row</b>:</p>'+
      '<div class="serve">'+labels.map(function(l){return '<span class="who '+l[1]+'">'+l[0]+'</span><span class="lbl">'+l[2]+'</span><span></span>';}).join("")+'</div>';
    if (ppm){
      var plan=servePlan(ppm), each=[0,0,0,0];
      plan.forEach(function(b){ each[b.who]+=b.to-b.from+1; });
      h+='<p class="ex">For a '+ppm+'-point match:</p><div class="serve">'+plan.map(function(b){
        var l=labels[b.who];
        return '<span class="who '+l[1]+'">'+l[0]+'</span><span class="rng">Points '+b.from+(b.to>b.from?'–'+b.to:'')+'</span><span class="rng">'+(b.to-b.from+1)+' serve'+(b.to>b.from?'s':'')+'</span>';
      }).join("")+'</div>';

  function viewLive(){

  app.addEventListener("click", function(e){
    var t = e.target.closest("button,[data-act='close-bg']"); if(!t) return;
    if (t.dataset.act==="close-bg" && e.target!==t) return;
    var d = t.dataset;
    if (d.act!=="reset" && ui.resetArmed){ ui.resetArmed=false; }
    if (ui.notice && !d.tab) ui.notice=null;
    if (d.act!=="finish" && ui.finishArmed){ ui.finishArmed=false; }
    if (!t.hasAttribute("data-remove") && ui.removeArmed){ ui.removeArmed=null; }
    if (d.act!=="live-save" && ui.liveSaveArmed){ ui.liveSaveArmed=false; }
    if (d.act!=="del-session" && ui.delArmed){ ui.delArmed=false; }
    if (d.gsec){ ui.guideOpen = ui.guideOpen || {}; ui.guideOpen[d.gsec] = !ui.guideOpen[d.gsec]; render(); return; }
    if (d.mins!=null && t.hasAttribute("data-mins")){ S.matchMins=+d.mins; ui.minsOther=false; commit(); return; }
    if (d.deuce){ S.deuce=d.deuce; commit(); return; }
    if (d.third){ S.thirdSet=d.third; commit(); return; }
    if (t.hasAttribute("data-pick")){ togglePlayer(t.getAttribute("data-pick")); commit(); return; }
    if (t.hasAttribute("data-unroster")){
      var un=t.getAttribute("data-unroster"), uk=lc(un);
      if (isPicked(un)) togglePlayer(un);
      S.roster=(S.roster||[]).filter(function(n){return lc(n)!==uk;});
      S.rosterHidden=(S.rosterHidden||[]).filter(function(n){return lc(n)!==uk;}).concat([un]);
      commit(); return;
    }
    if (t.hasAttribute("data-dpick")){ var dn=t.getAttribute("data-dpick"), dr=ui.draft||[]; if (dr.some(function(x){return lc(x)===lc(dn);})) ui.draft=dr.filter(function(x){return lc(x)!==lc(dn);}); else ui.draft=dr.concat([dn]); render(); return; }
    if (t.hasAttribute("data-pairout")){ var po=t.getAttribute("data-pairout"); if (ui.pairOutArmed!==po){ ui.pairOutArmed=po; render(); return; } ui.pairOutArmed=null; pairLeaves(po); return; }
    if (t.hasAttribute("data-whopick")){ ui.modal = {kind:"who", pick:t.getAttribute("data-whopick")}; render(); return; }
    if (d.memode){ ui.meMode=d.memode; render(); return; }
    if (t.hasAttribute("data-undo")){
      var uid2=t.getAttribute("data-undo"); ui.pinErr="Undoing\u2026"; render();
      adminPost({op:"undo", pin:ui.pin, id:uid2}, function(res){
        ui.pinErr=""; ui.peopleMsg="Done \u2013 that change has been undone.";
        if (res.history) setHistory(res.history, res.hv);
        if (res.state){ if (typeof res.v==="number") ver=res.v; applyRemote(res.state); }
        if (Array.isArray(res.log)) ui.log=res.log; render();
      });
      return;
    }
    if (t.hasAttribute("data-remove")){
      var rn=t.getAttribute("data-remove");
      if (inTodaysSession(rn)){ ui.peopleMsg=""; ui.pinErr=rn+" is playing in today\u2019s session. Finish or reset it first."; ui.removeArmed=null; render(); return; }
      if (ui.removeArmed!==rn){ ui.removeArmed=rn; render(); return; }
      ui.removeArmed=null; ui.pinErr="";
      S.roster=(S.roster||[]).filter(function(n){ return lc(n)!==lc(rn); });
      S.rosterHidden=(S.rosterHidden||[]).filter(function(n){ return lc(n)!==lc(rn); }).concat([rn]);
      ui.peopleMsg="Removed "+rn+" from the name lists. Their results are kept."; commit(); return;

        var x=md.a[i], y=md.b[i];
        if (x==null && y==null) continue;
        if (x==null || y==null){ md.err="Set "+(i+1)+" needs a score for both sides."; render(); return; }
        a.push(x); b.push(y);
      }
      if (!a.length){ md.err="Enter at least one set."; render(); return; }
    } else {
      a=[md.a[0]||0]; b=[md.b[0]||0];
      if (AM() && S.ppm && a[0]+b[0]!==S.ppm){ md.err="Scores should add up to "+S.ppm+" (currently "+(a[0]+b[0])+")."; render(); return; }
    }
    md.m.score={a:a,b:b}; var sm=md.m; ui.modal=null; commitScore(sm); cheerIfMyWin(sm);
  }

  function copyTable(){
    var lines=[S.name, ""];
    if (ROT()){
      standingsRot().forEach(function(x,i){ lines.push((i+1)+". "+x.name+" \u2014 "+x.pts+" pts ("+x.w+"W "+x.d+"D "+x.l+"L, games "+sign(x.gd)+(setsMode()?", sets "+sign(x.sd):"")+")"); });
    } else if (AM()){
      standingsAm().forEach(function(x,i){
        lines.push((i+1)+". "+x.name+" — "+x.pf+" pts ("+x.w+"W "+x.d+"D "+x.l+"L, "+sign(x.diff)+(S.rankBy==="avg"?", avg "+x.avg.toFixed(1):"")+")");
      });
    } else {
      standingsTeams().forEach(function(x,i){
        lines.push((i+1)+". "+x.name+" — "+x.pts+" pts ("+x.w+"W "+x.d+"D "+x.l+"L, games "+sign(x.gd)+(setsMode()?", sets "+sign(x.sd):"")+")");
      });
    }
    var txt=lines.join("\n");
    try {
      navigator.clipboard.writeText(txt).then(function(){ui.copied=true;render();}).catch(function(){fallbackCopy(txt);});
    } catch(e){ fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ui.copied=true; }catch(e){}
    document.body.removeChild(ta); render();
  }

  render();
  if (loaded) maybeWelcome();

  app.addEventListener("focusout", function(){ if (pendingRender){ pendingRender=false; setTimeout(function(){ if(!app.contains(document.activeElement)||document.activeElement===document.body) render(); else pendingRender=true; }, 0); } });
  connect();
})();
</script>
</body>
</html>
